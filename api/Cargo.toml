[package]
name = "prevant"
version = "0.9.0"
authors = ["Marc Schreiber <marc.schreiber@aixigo.de>"]
repository = "https://github.com/aixigo/PREvant/"
edition = "2024"

[[bin]]
name = "prevant"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
async-stream = "0.3"
base64 = "0.22"
boa_engine = "0.20"
bollard = { version = "0.19", features = ["chrono"] }
bytesize = { version = "2.0", features = ["serde"] }
bytes = "1.10"
chrono = { workspace = true }
clap = { version = "4.4", features = ["derive", "cargo", "help", "usage", "error-context"] }
cron = "0.15"
domain = { path = "../domain" }
dyn-clone = "1.0"
env_logger = "0.11"
exponential-backoff = "2.1"
evmap = "10.0"
figment = { version = "0.10", features = ["env", "toml"] }
futures = { version = "0.3", features = ["compat"] }
handlebars = { workspace = true }
http = "1.3"
http-api-problem = "0.60"
humantime = "2.3"
hyper = "1.7"
hyper-util = "0.1"
http-body-util = "0.1"
jira_query = "1.6"
jsonschema = { workspace = true }
# If you adjust the feature to increase the supported K8s version, make sure to
# also adjust the k3d integration job
k8s-openapi = { version = "0.26", default-features = false, features = ["v1_30"] }
kube = { version = "2.0", default-features = false, features = ["client", "derive", "rustls-tls", "ws"] }
lazy_static = "1.5"
log = "0.4"
multimap = "0.10"
oci-client = { workspace = true }
openidconnect = { workspace = true }
regex = { workspace = true }
regex-syntax = "0.8"
reqwest = "0.12"
rocket = { version = "0.5", features = ["json", "secrets"] }
schemars = "1.1"
secstr = { workspace = true }
serde = { workspace = true }
serde-value = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde_norway = "0.9"
serde_regex = "1.1"
sqlx = { version = "0.8", features = ["tls-rustls", "runtime-tokio", "postgres", "uuid", "chrono"] }
tar = "0.4"
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
url = { workspace = true }
uuid = { version = "1.18", features = ["serde", "v4"] }
yansi = "1.0"

[dev-dependencies]
assert-json-diff = { workspace = true }
figment = { version = "0.10", features = ["test"] }
pretty_assertions = { workspace = true }
rstest = { workspace = true }
sha2 = { workspace = true }
tempfile = "3.19"
testcontainers = { version = "0.26", features = ["docker-compose"] }
testcontainers-modules = { version = "0.14", features = ["k3s", "postgres"] }

