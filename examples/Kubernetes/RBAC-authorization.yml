---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
   name: prevant-role
rules:
 - apiGroups:
    - ""
   resources:
    - configmaps
    - namespaces
    - persistentvolumeclaims
    - pods
    - secrets
    - serviceaccounts
    - services
   verbs:
    - get
    - list
    - watch
    - create
    - patch
    - delete
 - apiGroups:
    - ""
   resources:
    - pods/log
    - pods/portforward
    - pods/status
   verbs:
    - get
    - create
 - apiGroups:
    - apps
   resources:
    - deployments
    - statefulsets
   verbs:
    - get
    - list
    - create
    - patch
    - delete
 - apiGroups:
    - batch
   resources:
    - jobs
    - cronjobs
   verbs:
    - get
    - list
    - create
    - patch
    - delete
 - apiGroups:
    - networking.k8s.io
   resources:
    - networkpolicies
   verbs:
    - get
    - list
    - create
    - patch
    - delete
 - apiGroups:
    - storage.k8s.io
   resources:
    - storageclasses
   verbs:
    - get
    - list
 - apiGroups:
    - rbac.authorization.k8s.io
   resources:
    - roles
    - rolebindings
   verbs:
    - get
    - list
    - create
    - patch
    - delete
 # Traefik CRDs: (for Traefik v2 use traefik.containo.us and for Traefik v3 use traefik.io)
 - apiGroups:
    - traefik.containo.us
   resources:
    - middlewares
    - ingressroutes
   verbs:
    - get
    - list
    - create
    - update
    - patch
    - delete
 # Makes sure PREvant can read what it is allowed to read
 - apiGroups:
    - apiextensions.k8s.io
   resources:
    - customresourcedefinitions
   verbs:
    - get
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
   name: prevant-role
roleRef:
   apiGroup: rbac.authorization.k8s.io
   kind: ClusterRole
   name: prevant-role
subjects:
 - kind: ServiceAccount
   name: prevant
   namespace: default

